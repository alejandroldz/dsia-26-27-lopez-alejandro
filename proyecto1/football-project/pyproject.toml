[project]
name = "football-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alejandroldz", email = "alejandrold@correo.ugr.es" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
football-project = "football_project:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
